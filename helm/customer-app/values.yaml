replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/customer-app/customer-app
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  host: ""   # vacío = OpenShift genera el host automáticamente

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
