{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "customer-app.fullname" . }}
  labels:
    {{- include "customer-app.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: {{ include "customer-app.fullname" . }}
  port:
    targetPort: 8080
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
{{- end }}
