apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: turbo-webhook-handler
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SysCarmenB/customer-app-gitops.git
    targetRevision: main
    path: helm/turbo-webhook-handler
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: customer-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
